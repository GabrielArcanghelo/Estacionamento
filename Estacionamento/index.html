<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Login - Estacionamento</title>
  </head>

  <!-- IMPORTANTE: ID para mudar o tema -->
  <body class="bg-light">
    <script src="script.js" defer></script>

    <div
      class="container d-flex justify-content-center align-items-center"
      style="height: 100vh"
    >
      <div class="card shadow p-4" style="width: 380px">
        <h3 class="text-center mb-4">Login</h3>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="emailLogin" class="form-control" />
        </div>

        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" id="senhaLogin" class="form-control" />
        </div>

        <button class="btn btn-primary w-100" onclick="fazerLogin()">
          Entrar
        </button>

        <p class="text-center mt-3">
          Não tem conta?
          <a href="cadastro.html">Cadastre-se</a>
        </p>
      </div>
    </div>
  </body>
</html>

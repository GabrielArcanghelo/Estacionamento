<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Menu</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid bg-primary" id="menu">
        <a class="navbar-brand text-white" href="#">Dashboard</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav me-auto">
            <a
              class="nav-link active text-white"
              aria-current="page"
              href="#recargaSaldo"
              >Recarga de Saldo</a
            >
            <a class="nav-link text-white" href="#consultarExtrato"
              >Consultar Extrato</a
            >
            <a class="nav-link text-white" href="#ultimasEstadias"
              >Últimas Estadias</a
            >
            <a class="nav-link text-white" href="#adicionarVeiculo"
              >Adicionar Veículo</a
            >
          </div>

          <!-- Botão Perfil à direita -->
          <button class="botaoPerfil">
            <span>Perfil</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              class="bi bi-person-circle"
              viewBox="0 0 16 16"
            >
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
              <path
                fill-rule="evenodd"
                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Conteúdo principal da página -->

    <main class="Card-principal">
      <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
        </div>

        <!--Imagens do card-->

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="Bem-Vindo.png"
              class="d-block w-100"
              alt="Informativo Bem-Vindo"
            />
          </div>
          <div class="carousel-item">
            <img
              src="Estacionamento1.png"
              class="d-block w-100"
              alt="Informativo Adicionar Veículo"
            />
          </div>
          <div class="carousel-item">
            <img
              src="Contato.png"
              class="d-block w-100"
              alt="Informativo Contato"
            />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </main>

    <!--Footer do Menu-->
    <footer class="bg-primary text-center text-white mt-4">
      <div class="text-center p-3" id="texto-footer"></div>
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
